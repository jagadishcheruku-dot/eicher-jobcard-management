services:
  - type: web
    name: eicher-jobcard-management
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        fromDatabase:
          name: eicher-db
          property: connectionString

databases:
  - name: eicher-db
    plan: free
    region: singapore
    databaseName: eicher
    user: eicher
